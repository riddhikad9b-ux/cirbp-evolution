<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06141f"/>
      <stop offset="0.55" stop-color="#0b2a3a"/>
      <stop offset="1" stop-color="#123c4d"/>
    </linearGradient>
    <linearGradient id="temp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ec8ff"/>
      <stop offset="0.5" stop-color="#9fe3c0"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#5ec8ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5ec8ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t1 { fill: #e9f6ff; font-size: 40px; font-weight: 700; letter-spacing: 0.5px; }
      .t2 { fill: #9fe3c0; font-size: 19px; font-weight: 500; }
      .t3 { fill: #7fa9bd; font-size: 14px; letter-spacing: 1.5px; }
      .ax { fill: #7fa9bd; font-size: 12px; }
      .tag { fill: #06141f; font-size: 13px; font-weight: 700; }
      .dot { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      .flake { transform-origin: 1105px 62px; animation: spin 18s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .scan { animation: scan 6s ease-in-out infinite; }
      @keyframes scan { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 0.8; } 85% { opacity: 0.8; } 100% { transform: translateX(400px); opacity: 0; } }
      .wave { stroke-dasharray: 6 6; animation: dash 2.5s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- faint codon text background -->
  <g fill="#ffffff" opacity="0.045" font-family="Consolas, monospace" font-size="15">
    <text x="20" y="40">ATG GCA TCC GAT GAA GGC AAA CTT TTT GTT GGA GGG CTG AGC TTT GAC ACC AAT GAG CAG TCG CTG GAG CAG GTC TTC TCA AAG TAC GGA CAG ATC TCT GAA GTG</text>
    <text x="-30" y="290">CGG GGC CGA GGC GGC TCC GGT GGC CGC GGC TAT GGT GGC TCC GGT CGA GGC GGT CGA GGC TAC CGT GGC GGA GGT AGC CGG GGC TAC ACC GGT GGC AGC GAC</text>
  </g>

  <!-- left: title block -->
  <text x="48" y="96" class="t3">PART 2 OF SLEEP-CIRBP  ·  COMPARATIVE GENOMICS</text>
  <text x="48" y="146" class="t1">CIRBP Evolution</text>
  <text x="48" y="182" class="t2">Did long-lived mammals evolve a better DNA-repair gene?</text>

  <!-- stat chips -->
  <g transform="translate(48,212)">
    <rect width="132" height="30" rx="15" fill="#5ec8ff"/>
    <text x="66" y="20" text-anchor="middle" class="tag">251 mammals</text>
    <rect x="144" width="148" height="30" rx="15" fill="#9fe3c0"/>
    <text x="218" y="20" text-anchor="middle" class="tag">67 control genes</text>
    <rect x="304" width="200" height="30" rx="15" fill="#ff8a5c"/>
    <text x="404" y="20" text-anchor="middle" class="tag">Answer: whale-specific</text>
  </g>

  <!-- right: scatter plot panel -->
  <g transform="translate(660,60)">
    <rect x="0" y="0" width="420" height="190" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#5ec8ff" stroke-opacity="0.25"/>
    <!-- axes -->
    <line x1="40" y1="160" x2="400" y2="160" stroke="#7fa9bd" stroke-width="1"/>
    <line x1="40" y1="20" x2="40" y2="160" stroke="#7fa9bd" stroke-width="1"/>
    <rect x="40" y="166" width="360" height="5" rx="2.5" fill="url(#temp)"/>
    <text x="40" y="186" class="ax">cool body</text>
    <text x="400" y="186" class="ax" text-anchor="end">warm body</text>
    <text x="22" y="92" class="ax" transform="rotate(-90 22 92)" text-anchor="middle">CIRBP codons</text>

    <!-- species dots: flat cloud, coloured by lineage -->
    <g class="dot">
      <circle cx="62" cy="96" r="4.5" fill="#5ec8ff"/><circle cx="78" cy="118" r="4.5" fill="#5ec8ff"/>
      <circle cx="90" cy="84" r="4.5" fill="#5ec8ff"/><circle cx="104" cy="108" r="4.5" fill="#5ec8ff"/>
      <circle cx="140" cy="74" r="4.5" fill="#9fe3c0"/><circle cx="162" cy="112" r="4.5" fill="#9fe3c0"/>
      <circle cx="178" cy="92" r="4.5" fill="#9fe3c0"/><circle cx="196" cy="128" r="4.5" fill="#9fe3c0"/>
    </g>
    <g class="dot" style="animation-delay:1.1s">
      <circle cx="214" cy="80" r="4.5" fill="#c3a6ff"/><circle cx="232" cy="104" r="4.5" fill="#c3a6ff"/>
      <circle cx="250" cy="122" r="4.5" fill="#c3a6ff"/><circle cx="268" cy="88" r="4.5" fill="#c3a6ff"/>
      <circle cx="286" cy="110" r="4.5" fill="#ffd27a"/><circle cx="300" cy="76" r="4.5" fill="#ffd27a"/>
    </g>
    <g class="dot" style="animation-delay:2.2s">
      <circle cx="318" cy="100" r="4.5" fill="#ff8a5c"/><circle cx="334" cy="126" r="4.5" fill="#ff8a5c"/>
      <circle cx="350" cy="86" r="4.5" fill="#ff8a5c"/><circle cx="366" cy="112" r="4.5" fill="#ff8a5c"/>
      <circle cx="382" cy="94" r="4.5" fill="#ff8a5c"/>
    </g>
    <!-- flat trend line: no effect -->
    <line x1="50" y1="102" x2="392" y2="102" stroke="#e9f6ff" stroke-width="1.6" class="wave" opacity="0.8"/>
    <text x="392" y="40" class="ax" text-anchor="end" fill="#e9f6ff">within orders: p = 0.49</text>
    <!-- scanning line -->
    <rect x="40" y="20" width="2" height="140" fill="#9fe3c0" class="scan"/>
  </g>

  <!-- snowflake (cold-inducible) -->
  <g class="flake" stroke="#5ec8ff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9">
    <line x1="1105" y1="44" x2="1105" y2="80"/>
    <line x1="1089.4" y1="53" x2="1120.6" y2="71"/>
    <line x1="1089.4" y1="71" x2="1120.6" y2="53"/>
    <polyline points="1099,49 1105,55 1111,49"/>
    <polyline points="1099,75 1105,69 1111,75"/>
  </g>

  <!-- whale silhouette, bottom right -->
  <g transform="translate(1110,262) scale(0.9)" fill="#5ec8ff" opacity="0.55">
    <path d="M-78,2 C-80,-20 -58,-32 -30,-30 C0,-28 30,-18 50,-8 C56,-5 60,-4 64,-6 C70,-14 80,-20 90,-18 C84,-12 80,-6 78,-2 C82,2 90,8 92,14 C82,14 72,8 66,4 C60,4 54,6 46,8 C20,16 -20,18 -50,14 C-66,12 -77,8 -78,2 Z"/>
    <path d="M-76,4 C-60,10 -40,10 -28,4" stroke="#06141f" stroke-width="1.6" fill="none" opacity="0.6"/>
    <circle cx="-50" cy="-4" r="2.2" fill="#06141f"/>
  </g>
</svg>
